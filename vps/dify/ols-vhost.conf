# OpenLiteSpeed Virtual Host — dify.believeth.net
# Place this in DirectAdmin's custom vhost config for the dify subdomain,
# or add it via DirectAdmin -> Domains -> dify.believeth.net -> Custom HTTPD Config
#
# Dify's nginx container listens on 127.0.0.1:8080
#
# To create the subdomain in DirectAdmin:
#   1. Login as user -> Extra Features -> Create Subdomain
#   2. Subdomain: dify | Domain: believeth.net
#   3. Then apply the proxy config below via the custom config panel

virtualhost dify.believeth.net {
    vhRoot                  /home/believeth/domains/dify.believeth.net/public_html
    configFile              $SERVER_ROOT/conf/vhosts/dify.believeth.net/vhconf.conf
    allowSymbolLink         1
    enableScript            1
    restrained              0
    setUIDMode              2
}

